site_name: Personal Knowledge Repository
theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: green
      accent: orange
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  font:
    text: Segoe UI
    code: Fira Code

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Automatic KS: automaticks/index.md
  - Liability Engine: liabilityengine/index.md
  - Price Confidence: price-confidence/index.md
  - Meeting Notes: meeting-notes/index.md

{% extends "base.html" %}

{% block extrahead %}
  <style>
    :root {
      --md-primary-fg-color: #0d5d3d;
      --md-primary-bg-color: #0d5d3d;
      --md-accent-fg-color: #ff8c00;
    }

    html, body {
      background-color: #0d5d3d !important;
    }

    .md-page {
      background-color: #0d5d3d !important;
    }

    .md-container {
      background-color: #0d5d3d !important;
    }

    .md-content {
      background-color: #0d5d3d !important;
      color: #ffffff !important;
    }

    .md-sidebar {
      background-color: #0d5d3d !important;
    }

    .md-nav {
      background-color: #0d5d3d !important;
    }

    .md-nav__link {
      color: #ffffff !important;
    }

    .md-nav__link:hover {
      color: #ffaa00 !important;
    }

    .md-nav__link--active {
      color: #ffaa00 !important;
    }

    h1, h2, h3, h4, h5, h6 {
      color: #ffffff !important;
    }

    p, li, td {
      color: #ffffff !important;
    }

    a {
      color: #ff8c00 !important;
      font-weight: bold !important;
    }

    a:hover {
      color: #ffaa00 !important;
    }

    code {
      background-color: #0a2a1a !important;
      color: #ffffff !important;
    }

    pre {
      background-color: #0a2a1a !important;
      color: #ffffff !important;
    }

    details {
      background-color: #0a2a1a !important;
      border: 1px solid #ff8c00 !important;
    }

    details summary {
      color: #ffffff !important;
    }

    th {
      background-color: #0d5d3d !important;
      color: #ffffff !important;
    }

    .md-nav__title {
      display: none !important;
    }

    .md-header {
      background-color: #052d1a !important;
      cursor: pointer !important;
    }

    .md-header__inner {
      cursor: pointer !important;
    }
  </style>
{% endblock %}

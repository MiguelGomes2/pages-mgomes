{% extends "base.html" %}

{% block styles %}
  {{ super() }}
  <link rel="stylesheet" href="{{ config.docs_dir }}/../stylesheets/custom.css">
{% endblock %}

{% block header %}
  <header class="md-header" data-md-component="header">
    <nav class="md-header__inner md-grid">
      <button class="md-header__button md-logo" aria-label="Go to home">
        <a href="{{ config.site_url }}" title="Home" class="md-header__link">
          {{ config.site_name }}
        </a>
      </button>
    </nav>
  </header>
{% endblock %}
